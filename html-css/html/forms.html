
<!-- FORMULARIOS -->


<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="/img/3528308.png" type="image/x-icon">
    <title>Formularios</title>
</head>
<body>
    <h1>Formularios</h1>
    <hr>

    <form action="carlos" method="get" name="miformulario" id="miformulario">
        <label for="usuario">Usuario: </label>
        <input type="text" name="usuario" id="usu" size="20" autocomplete="false">
        <br><br>
        <label for="pass">Contraseña:</label>
        <input type="password" name="pass" id="pass">
        <br><br>
        <label for="edad">Edad</label>
        <input type="number" name="edad" id="edad" placeholder="Ingrese su edad" min="17" size="30">
        <br><br>
        <label for="telefono">Telefono:</label>
        <input type="tel" name="telefono" id="telefono">
        <br><br>
        <label for="comentarios">Comentarios: </label>
        <textarea name="Comentarios" id="comentario" cols="30" rows="5" minlength="3" maxlength="400"></textarea>
        <br><br><br>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpiar">
    </form>
</body>
</html>

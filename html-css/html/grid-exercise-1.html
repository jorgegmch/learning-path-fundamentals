
<!-- EJERCICIO DE GRID -->

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contenedores con Grid</title>
    <style>
        body {
            background-color: #ccc;
        }

        .container {
            background-color: #2196f3;
            font-weight: bold;
            padding: 10px;

            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .grid-items {
            background-color: rgba(255,255, 255, 0.8);
            border: 1px solid rgba(0,0,0,0.5);
            font-size: 2rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="grid-items">1</div>
        <div class="grid-items">2</div>
        <div class="grid-items">3</div>
        <div class="grid-items">4</div>
        <div class="grid-items">5</div>
        <div class="grid-items">6</div>
        <div class="grid-items">7</div>
        <div class="grid-items">8</div>
        <div class="grid-items">9</div>
    </div>
</body>
</html>

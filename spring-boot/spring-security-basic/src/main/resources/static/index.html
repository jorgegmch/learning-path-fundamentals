<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <!-- Bootstrap 5.3.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-container">
            <h2 class="text-center">Bienvenido</h2>
            <p class="text-center text-muted">Ingrese sus credenciales para continuar</p>
            
            <form id="login-form">
                <div class="mb-3">
                    <label for="username" class="form-label"><i class="bi bi-person-circle"></i> Usuario</label>
                    <input type="text" id="username" class="form-control" placeholder="Ingrese su usuario" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label"><i class="bi bi-lock-fill"></i> Contraseña</label>
                    <input type="password" id="password" class="form-control" placeholder="Ingrese su contraseña" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Ingresar</button>
            </form>

            <!-- Mensaje de error dinámico si la autenticación falla -->
            <p id="error-message" class="text-danger text-center mt-3"></p>
            <p class="text-center mt-3"><a href="#" class="text-muted">¿Olvidaste tu contraseña?</a></p>
        </div>
    </div>

    <script src="js/login.js" defer></script>
</body>
</html>
